name: Apply language runtime fallback

on:
  push:
    branches: [modernize-1.4.0]
    paths: ['.github/workflows/apply-language-runtime.yml']

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch language loader and Persian fallback keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('functions.inc')
          s = p.read_text()
          old = """$langfile = $plugin_path . 'language/' . $_CONF['language'] . '.php';

if (file_exists($langfile)) {
    require_once $langfile;
} else {
    require_once $plugin_path . 'language/english.php';
}
"""
          new = """$langfile = $plugin_path . 'language/' . $_CONF['language'] . '.php';
$englishLangFile = $plugin_path . 'language/english.php';

// English is the canonical language. Load it first and keep it as the
// per-key fallback when a translation file is incomplete.
require_once $englishLangFile;

$menuEnglishLanguage = array(
    'LANG_MENU_1' => $LANG_MENU_1,
    'LANG_MENU00' => $LANG_MENU00,
    'LANG_MENU01' => $LANG_MENU01,
    'LANG_HC' => $LANG_HC,
    'LANG_HS' => $LANG_HS,
    'LANG_VC' => $LANG_VC,
    'LANG_VS' => $LANG_VS,
    'LANG_MENU_MENU_TYPES' => $LANG_MENU_MENU_TYPES,
    'LANG_MENU_TYPES' => $LANG_MENU_TYPES,
    'LANG_MENU_TARGET' => $LANG_MENU_TARGET,
    'LANG_MENU_GLFUNCTION' => $LANG_MENU_GLFUNCTION,
    'LANG_MENU_GLTYPES' => $LANG_MENU_GLTYPES,
    'LANG_MENU_ADMIN' => $LANG_MENU_ADMIN,
    'LANG_MENU_GLTYPES_HELP' => $LANG_MENU_GLTYPES_HELP,
    'LANG_MENU_GLFUNCTION_HELP' => $LANG_MENU_GLFUNCTION_HELP,
    'LANG_MENU_TYPES_HELP' => $LANG_MENU_TYPES_HELP,
);

$menuEnglishConfigLanguage = array(
    'LANG_configsections' => isset($LANG_configsections['menu']) ? $LANG_configsections['menu'] : array(),
    'LANG_confignames' => isset($LANG_confignames['menu']) ? $LANG_confignames['menu'] : array(),
    'LANG_configsubgroups' => isset($LANG_configsubgroups['menu']) ? $LANG_configsubgroups['menu'] : array(),
    'LANG_tab' => isset($LANG_tab['menu']) ? $LANG_tab['menu'] : array(),
    'LANG_fs' => isset($LANG_fs['menu']) ? $LANG_fs['menu'] : array(),
    'LANG_configselects' => isset($LANG_configselects['menu']) ? $LANG_configselects['menu'] : array(),
);

if ($langfile !== $englishLangFile && file_exists($langfile)) {
    require $langfile;

    $LANG_MENU_1 = array_replace($menuEnglishLanguage['LANG_MENU_1'], isset($LANG_MENU_1) && is_array($LANG_MENU_1) ? $LANG_MENU_1 : array());
    $LANG_MENU00 = array_replace($menuEnglishLanguage['LANG_MENU00'], isset($LANG_MENU00) && is_array($LANG_MENU00) ? $LANG_MENU00 : array());
    $LANG_MENU01 = array_replace($menuEnglishLanguage['LANG_MENU01'], isset($LANG_MENU01) && is_array($LANG_MENU01) ? $LANG_MENU01 : array());
    $LANG_HC = array_replace($menuEnglishLanguage['LANG_HC'], isset($LANG_HC) && is_array($LANG_HC) ? $LANG_HC : array());
    $LANG_HS = array_replace($menuEnglishLanguage['LANG_HS'], isset($LANG_HS) && is_array($LANG_HS) ? $LANG_HS : array());
    $LANG_VC = array_replace($menuEnglishLanguage['LANG_VC'], isset($LANG_VC) && is_array($LANG_VC) ? $LANG_VC : array());
    $LANG_VS = array_replace($menuEnglishLanguage['LANG_VS'], isset($LANG_VS) && is_array($LANG_VS) ? $LANG_VS : array());
    $LANG_MENU_MENU_TYPES = array_replace($menuEnglishLanguage['LANG_MENU_MENU_TYPES'], isset($LANG_MENU_MENU_TYPES) && is_array($LANG_MENU_MENU_TYPES) ? $LANG_MENU_MENU_TYPES : array());
    $LANG_MENU_TYPES = array_replace($menuEnglishLanguage['LANG_MENU_TYPES'], isset($LANG_MENU_TYPES) && is_array($LANG_MENU_TYPES) ? $LANG_MENU_TYPES : array());
    $LANG_MENU_TARGET = array_replace($menuEnglishLanguage['LANG_MENU_TARGET'], isset($LANG_MENU_TARGET) && is_array($LANG_MENU_TARGET) ? $LANG_MENU_TARGET : array());
    $LANG_MENU_GLFUNCTION = array_replace($menuEnglishLanguage['LANG_MENU_GLFUNCTION'], isset($LANG_MENU_GLFUNCTION) && is_array($LANG_MENU_GLFUNCTION) ? $LANG_MENU_GLFUNCTION : array());
    $LANG_MENU_GLTYPES = array_replace($menuEnglishLanguage['LANG_MENU_GLTYPES'], isset($LANG_MENU_GLTYPES) && is_array($LANG_MENU_GLTYPES) ? $LANG_MENU_GLTYPES : array());
    $LANG_MENU_ADMIN = array_replace($menuEnglishLanguage['LANG_MENU_ADMIN'], isset($LANG_MENU_ADMIN) && is_array($LANG_MENU_ADMIN) ? $LANG_MENU_ADMIN : array());
    $LANG_MENU_GLTYPES_HELP = array_replace($menuEnglishLanguage['LANG_MENU_GLTYPES_HELP'], isset($LANG_MENU_GLTYPES_HELP) && is_array($LANG_MENU_GLTYPES_HELP) ? $LANG_MENU_GLTYPES_HELP : array());
    $LANG_MENU_GLFUNCTION_HELP = array_replace($menuEnglishLanguage['LANG_MENU_GLFUNCTION_HELP'], isset($LANG_MENU_GLFUNCTION_HELP) && is_array($LANG_MENU_GLFUNCTION_HELP) ? $LANG_MENU_GLFUNCTION_HELP : array());
    $LANG_MENU_TYPES_HELP = array_replace($menuEnglishLanguage['LANG_MENU_TYPES_HELP'], isset($LANG_MENU_TYPES_HELP) && is_array($LANG_MENU_TYPES_HELP) ? $LANG_MENU_TYPES_HELP : array());

    $LANG_configsections['menu'] = array_replace($menuEnglishConfigLanguage['LANG_configsections'], isset($LANG_configsections['menu']) && is_array($LANG_configsections['menu']) ? $LANG_configsections['menu'] : array());
    $LANG_confignames['menu'] = array_replace($menuEnglishConfigLanguage['LANG_confignames'], isset($LANG_confignames['menu']) && is_array($LANG_confignames['menu']) ? $LANG_confignames['menu'] : array());
    $LANG_configsubgroups['menu'] = array_replace($menuEnglishConfigLanguage['LANG_configsubgroups'], isset($LANG_configsubgroups['menu']) && is_array($LANG_configsubgroups['menu']) ? $LANG_configsubgroups['menu'] : array());
    $LANG_tab['menu'] = array_replace($menuEnglishConfigLanguage['LANG_tab'], isset($LANG_tab['menu']) && is_array($LANG_tab['menu']) ? $LANG_tab['menu'] : array());
    $LANG_fs['menu'] = array_replace($menuEnglishConfigLanguage['LANG_fs'], isset($LANG_fs['menu']) && is_array($LANG_fs['menu']) ? $LANG_fs['menu'] : array());
    $LANG_configselects['menu'] = array_replace($menuEnglishConfigLanguage['LANG_configselects'], isset($LANG_configselects['menu']) && is_array($LANG_configselects['menu']) ? $LANG_configselects['menu'] : array());
}

unset($menuEnglishLanguage, $menuEnglishConfigLanguage);
"""
          if old not in s:
              raise SystemExit('language loader block not found')
          p.write_text(s.replace(old, new))
          PY

          php -r '
          function loadLang($file) {
              $LANG_configsections = $LANG_confignames = $LANG_configsubgroups = $LANG_tab = $LANG_fs = $LANG_configselects = array();
              include $file;
              return get_defined_vars();
          }
          $en = loadLang("language/english.php");
          $fa = loadLang("language/persian_utf-8.php");
          $names = array("LANG_MENU_1","LANG_MENU00","LANG_MENU01","LANG_HC","LANG_HS","LANG_VC","LANG_VS","LANG_MENU_MENU_TYPES","LANG_MENU_TYPES","LANG_MENU_TARGET","LANG_MENU_GLFUNCTION","LANG_MENU_GLTYPES","LANG_MENU_ADMIN","LANG_MENU_GLTYPES_HELP","LANG_MENU_GLFUNCTION_HELP","LANG_MENU_TYPES_HELP");
          $out = "\n// English values for keys not yet translated to Persian.\n";
          foreach ($names as $name) {
              $base = isset($en[$name]) && is_array($en[$name]) ? $en[$name] : array();
              $trans = isset($fa[$name]) && is_array($fa[$name]) ? $fa[$name] : array();
              foreach (array_diff_key($base, $trans) as $k => $v) {
                  $out .= "$".$name."[".var_export($k, true)."] = ".var_export($v, true).";\n";
              }
          }
          foreach (array("LANG_configsections","LANG_confignames","LANG_configsubgroups","LANG_tab","LANG_fs","LANG_configselects") as $name) {
              $base = isset($en[$name]["menu"]) && is_array($en[$name]["menu"]) ? $en[$name]["menu"] : array();
              $trans = isset($fa[$name]["menu"]) && is_array($fa[$name]["menu"]) ? $fa[$name]["menu"] : array();
              foreach (array_diff_key($base, $trans) as $k => $v) {
                  $out .= "$".$name."[\"menu\"][".var_export($k, true)."] = ".var_export($v, true).";\n";
              }
          }
          file_put_contents("language/persian_utf-8.php", file_get_contents("language/persian_utf-8.php").$out);
          '

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          php -l functions.inc
          php -l language/english.php
          php -l language/french_france_utf-8.php
          php -l language/persian_utf-8.php
          php tests/language_contract.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions.inc language/persian_utf-8.php
          git diff --cached --check
          git commit -m "feat: add per-key English fallback for translations"
          git pull --rebase origin modernize-1.4.0
          git push origin HEAD:modernize-1.4.0
