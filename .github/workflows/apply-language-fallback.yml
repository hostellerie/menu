    'LANG_configselects'  => isset($LANG_configselects['menu']) ? $LANG_configselects['menu'] : array(),
);

if ($langfile !== $englishLangFile && file_exists($langfile)) {
    require $langfile;

    $LANG_MENU_1 = array_replace($menuEnglishLanguage['LANG_MENU_1'], isset($LANG_MENU_1) && is_array($LANG_MENU_1) ? $LANG_MENU_1 : array());
    $LANG_MENU00 = array_replace($menuEnglishLanguage['LANG_MENU00'], isset($LANG_MENU00) && is_array($LANG_MENU00) ? $LANG_MENU00 : array());
    $LANG_MENU01 = array_replace($menuEnglishLanguage['LANG_MENU01'], isset($LANG_MENU01) && is_array($LANG_MENU01) ? $LANG_MENU01 : array());
    $LANG_HC = array_replace($menuEnglishLanguage['LANG_HC'], isset($LANG_HC) && is_array($LANG_HC) ? $LANG_HC : array());
    $LANG_HS = array_replace($menuEnglishLanguage['LANG_HS'], isset($LANG_HS) && is_array($LANG_HS) ? $LANG_HS : array());
    $LANG_VC = array_replace($menuEnglishLanguage['LANG_VC'], isset($LANG_VC) && is_array($LANG_VC) ? $LANG_VC : array());
    $LANG_VS = array_replace($menuEnglishLanguage['LANG_VS'], isset($LANG_VS) && is_array($LANG_VS) ? $LANG_VS : array());
    $LANG_MENU_MENU_TYPES = array_replace($menuEnglishLanguage['LANG_MENU_MENU_TYPES'], isset($LANG_MENU_MENU_TYPES) && is_array($LANG_MENU_MENU_TYPES) ? $LANG_MENU_MENU_TYPES : array());
    $LANG_MENU_TYPES = array_replace($menuEnglishLanguage['LANG_MENU_TYPES'], isset($LANG_MENU_TYPES) && is_array($LANG_MENU_TYPES) ? $LANG_MENU_TYPES : array());
    $LANG_MENU_TARGET = array_replace($menuEnglishLanguage['LANG_MENU_TARGET'], isset($LANG_MENU_TARGET) && is_array($LANG_MENU_TARGET) ? $LANG_MENU_TARGET : array());
    $LANG_MENU_GLFUNCTION = array_replace($menuEnglishLanguage['LANG_MENU_GLFUNCTION'], isset($LANG_MENU_GLFUNCTION) && is_array($LANG_MENU_GLFUNCTION) ? $LANG_MENU_GLFUNCTION : array());
    $LANG_MENU_GLTYPES = array_replace($menuEnglishLanguage['LANG_MENU_GLTYPES'], isset($LANG_MENU_GLTYPES) && is_array($LANG_MENU_GLTYPES) ? $LANG_MENU_GLTYPES : array());
    $LANG_MENU_ADMIN = array_replace($menuEnglishLanguage['LANG_MENU_ADMIN'], isset($LANG_MENU_ADMIN) && is_array($LANG_MENU_ADMIN) ? $LANG_MENU_ADMIN : array());
    $LANG_MENU_GLTYPES_HELP = array_replace($menuEnglishLanguage['LANG_MENU_GLTYPES_HELP'], isset($LANG_MENU_GLTYPES_HELP) && is_array($LANG_MENU_GLTYPES_HELP) ? $LANG_MENU_GLTYPES_HELP : array());
    $LANG_MENU_GLFUNCTION_HELP = array_replace($menuEnglishLanguage['LANG_MENU_GLFUNCTION_HELP'], isset($LANG_MENU_GLFUNCTION_HELP) && is_array($LANG_MENU_GLFUNCTION_HELP) ? $LANG_MENU_GLFUNCTION_HELP : array());
    $LANG_MENU_TYPES_HELP = array_replace($menuEnglishLanguage['LANG_MENU_TYPES_HELP'], isset($LANG_MENU_TYPES_HELP) && is_array($LANG_MENU_TYPES_HELP) ? $LANG_MENU_TYPES_HELP : array());

    $LANG_configsections['menu'] = array_replace($menuEnglishConfigLanguage['LANG_configsections'], isset($LANG_configsections['menu']) && is_array($LANG_configsections['menu']) ? $LANG_configsections['menu'] : array());
    $LANG_confignames['menu'] = array_replace($menuEnglishConfigLanguage['LANG_confignames'], isset($LANG_confignames['menu']) && is_array($LANG_confignames['menu']) ? $LANG_confignames['menu'] : array());
    $LANG_configsubgroups['menu'] = array_replace($menuEnglishConfigLanguage['LANG_configsubgroups'], isset($LANG_configsubgroups['menu']) && is_array($LANG_configsubgroups['menu']) ? $LANG_configsubgroups['menu'] : array());
    $LANG_tab['menu'] = array_replace($menuEnglishConfigLanguage['LANG_tab'], isset($LANG_tab['menu']) && is_array($LANG_tab['menu']) ? $LANG_tab['menu'] : array());
    $LANG_fs['menu'] = array_replace($menuEnglishConfigLanguage['LANG_fs'], isset($LANG_fs['menu']) && is_array($LANG_fs['menu']) ? $LANG_fs['menu'] : array());
    $LANG_configselects['menu'] = array_replace($menuEnglishConfigLanguage['LANG_configselects'], isset($LANG_configselects['menu']) && is_array($LANG_configselects['menu']) ? $LANG_configselects['menu'] : array());
}

unset($menuEnglishLanguage, $menuEnglishConfigLanguage);
"""
          if old not in text:
              raise SystemExit('Expected language loader block not found')
          path.write_text(text.replace(old, new))
          PY

