      - name: Complete Persian file with missing English keys
        shell: bash
        run: |
          php -r '
          function loadLanguage($file) {
              $LANG_configsections = $LANG_confignames = $LANG_configsubgroups = $LANG_tab = $LANG_fs = $LANG_configselects = array();
              include $file;
              return get_defined_vars();
          }
          $english = loadLanguage("language/english.php");
          $persian = loadLanguage("language/persian_utf-8.php");
          $names = array("LANG_MENU_1","LANG_MENU00","LANG_MENU01","LANG_HC","LANG_HS","LANG_VC","LANG_VS","LANG_MENU_MENU_TYPES","LANG_MENU_TYPES","LANG_MENU_TARGET","LANG_MENU_GLFUNCTION","LANG_MENU_GLTYPES","LANG_MENU_ADMIN","LANG_MENU_GLTYPES_HELP","LANG_MENU_GLFUNCTION_HELP","LANG_MENU_TYPES_HELP");
          $out = "\n// English fallback values added for keys not yet translated.\n";
          foreach ($names as $name) {
              $base = isset($english[$name]) && is_array($english[$name]) ? $english[$name] : array();
              $translated = isset($persian[$name]) && is_array($persian[$name]) ? $persian[$name] : array();
              $missing = array_diff_key($base, $translated);
              foreach ($missing as $key => $value) {
                  $out .= "$" . $name . "[" . var_export($key, true) . "] = " . var_export($value, true) . ";\n";
              }
          }
          foreach (array("LANG_configsections","LANG_confignames","LANG_configsubgroups","LANG_tab","LANG_fs","LANG_configselects") as $name) {
              $base = isset($english[$name]["menu"]) && is_array($english[$name]["menu"]) ? $english[$name]["menu"] : array();
              $translated = isset($persian[$name]["menu"]) && is_array($persian[$name]["menu"]) ? $persian[$name]["menu"] : array();
              $missing = array_diff_key($base, $translated);
              foreach ($missing as $key => $value) {
                  $out .= "$" . $name . "[\"menu\"][" . var_export($key, true) . "] = " . var_export($value, true) . ";\n";
              }
          }
          file_put_contents("/tmp/persian-missing.php", $out);
          '
          cat /tmp/persian-missing.php >> language/persian_utf-8.php

      - name: Validate language files and fallback contract
        shell: bash
        run: |
          set -e
          php -l functions.inc
          php -l language/english.php
          php -l language/french_france_utf-8.php
          php -l language/persian_utf-8.php
          php tests/language_contract.php

      - name: Commit changes
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions.inc language/french_france_utf-8.php language/persian_utf-8.php
          git diff --cached --check
          git commit -m "feat: add per-key English language fallback and French translation"
          git push
