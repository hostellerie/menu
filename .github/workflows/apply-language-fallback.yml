    'LANG_MENU_TARGET'          => $LANG_MENU_TARGET,
    'LANG_MENU_GLFUNCTION'      => $LANG_MENU_GLFUNCTION,
    'LANG_MENU_GLTYPES'         => $LANG_MENU_GLTYPES,
