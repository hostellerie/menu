name: Apply language fallback and translations

on:
  push:
    branches:
      - modernize-1.4.0
    paths:
      - '.github/workflows/apply-language-fallback.yml'

permissions:
  contents: write

jobs:
  update-language-support:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Apply English per-key fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('functions.inc')
          text = path.read_text()
          old = """$langfile = $plugin_path . 'language/' . $_CONF['language'] . '.php';

if (file_exists($langfile)) {
    require_once $langfile;
} else {
    require_once $plugin_path . 'language/english.php';
}
"""
          new = """$langfile = $plugin_path . 'language/' . $_CONF['language'] . '.php';
$englishLangFile = $plugin_path . 'language/english.php';

// English is the canonical language and provides a per-key fallback for
// incomplete translations. Load it first, preserve its Menu language arrays,
// then overlay the selected translation where keys are available.
require_once $englishLangFile;

$menuEnglishLanguage = array(
    'LANG_MENU_1'               => $LANG_MENU_1,
    'LANG_MENU00'               => $LANG_MENU00,
    'LANG_MENU01'               => $LANG_MENU01,
    'LANG_HC'                   => $LANG_HC,
    'LANG_HS'                   => $LANG_HS,
