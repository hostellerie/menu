name: Temporary fix Menu POST forms

on:
  push:
    branches:
      - modernize-1.3.0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0

      - name: Fix standalone POST mutations
        shell: python
        run: |
          from pathlib import Path

          # Remove wrapper forms from list/tree templates: row controls now own
          # their POST forms and nested forms are invalid HTML.
          p = Path('templates/default/menutree.thtml')
          s = p.read_text()
          s = s.replace('<form method="post" id="menusel" action="{site_admin_url}/plugins/menu/index.php">\n<div>\n', '')
          s = s.replace('  <input type="hidden" id="menu" name="menu" value="{menuid}"{xhtml}>\n  <input type="hidden" name="mode" value="activate"{xhtml}>\n</div>\n</form>\n', '')
          s = s.replace('    {security_token_input}\n', '', 1)
          p.write_text(s)

          p = Path('templates/default/menulist.thtml')
          s = p.read_text()
          s = s.replace('  <form method="post" id="menusel" action="{site_admin_url}/plugins/menu/index.php">\n', '')
          s = s.replace('    <input type="hidden" id="menu" name="menu" value="{menuid}"{xhtml}>\n    <input type="hidden" name="mode" value="menuactivate"{xhtml}>\n  </form>\n', '')
          s = s.replace('    {security_token_input}\n', '', 1)
          p.write_text(s)

          # Element rows: activation becomes a targeted standalone POST form.
          p = Path('classes/classMenuElement2.php')
          s = p.read_text()
          old = "            $retval .=  '<input type=\"checkbox\" name=\"enableditem[' . $this->id . ']\" onclick=\"submit()\" value=\"1\"' . ($this->active == 1 ? ' checked=\"checked\"' : '') . XHTML . '>';"
          new = "            $retval .= '<form method=\"post\" action=\"' . $actionUrl . '\" style=\"display:inline\">' . $tokenInput . '<input type=\"hidden\" name=\"mode\" value=\"activate\"' . XHTML . '><input type=\"hidden\" name=\"menu\" value=\"' . (int) $this->menu_id . '\"' . XHTML . '><input type=\"hidden\" name=\"mid\" value=\"' . (int) $this->id . '\"' . XHTML . '><input type=\"hidden\" name=\"active\" value=\"' . ($this->active == 1 ? '0' : '1') . '\"' . XHTML . '><input type=\"checkbox\" onclick=\"this.form.submit()\"' . ($this->active == 1 ? ' checked=\"checked\"' : '') . XHTML . '></form>';"
          if old not in s:
              raise SystemExit('element activation pattern not found')
          s = s.replace(old, new)
          p.write_text(s)

          # Menu list activation becomes a targeted standalone POST form.
          p = Path('admin/index.php')
          s = p.read_text()
          old = "$T->set_var('menuactive','<input type=\"checkbox\" name=\"enabledmenu[' . $menu['menu_id'] . ']\" onclick=\"submit()\" value=\"1\"' . ($menu['active'] == 1 ? ' checked=\"checked\"' : '') . XHTML . '>');"
          new = "$T->set_var('menuactive', '<form method=\"post\" action=\"' . $_CONF['site_admin_url'] . '/plugins/menu/index.php\" style=\"display:inline\">' . MENU_adminTokenInput() . '<input type=\"hidden\" name=\"mode\" value=\"menuactivate\"' . XHTML . '><input type=\"hidden\" name=\"id\" value=\"' . (int) $menu['menu_id'] . '\"' . XHTML . '><input type=\"hidden\" name=\"active\" value=\"' . ($menu['active'] == 1 ? '0' : '1') . '\"' . XHTML . '><input type=\"checkbox\" onclick=\"this.form.submit()\"' . ($menu['active'] == 1 ? ' checked=\"checked\"' : '') . XHTML . '></form>');"
          if old not in s:
              raise SystemExit('menu activation pattern not found')
          s = s.replace(old, new)

          # Targeted activation handlers instead of disable-all/re-enable-array.
          start = s.index('function MENU_changeActiveStatusElement')
          end = s.index('/**\n* Enable and Disable block\n*/\nfunction MENU_changeActiveStatusMenu', start)
          elem_fn = '''function MENU_changeActiveStatusElement($bid_arr = null)\n{\n    global $_TABLES;\n\n    $menuId = (int) Geeklog\\Input::fPost('menu');\n    $mid = (int) Geeklog\\Input::fPost('mid');\n    $active = (int) Geeklog\\Input::fPost('active');\n    $active = $active === 1 ? 1 : 0;\n\n    if ($menuId > 0 && $mid > 0) {\n        DB_query("UPDATE {$_TABLES['menu_elements']} SET element_active=" . $active\n            . " WHERE id=" . $mid . " AND menu_id=" . $menuId);\n    }\n\n    MENU_CACHE_remove_instance('menu');\n    MENU_CACHE_remove_instance('css');\n    MENU_CACHE_remove_instance('js');\n}\n\n\n'''
          s = s[:start] + elem_fn + s[end:]

          start = s.index('function MENU_changeActiveStatusMenu')
          end = s.index('function MENU_deleteMenu', start)
          menu_fn = '''function MENU_changeActiveStatusMenu($bid_arr = null)\n{\n    global $_TABLES;\n\n    $menuId = (int) Geeklog\\Input::fPost('id');\n    $active = (int) Geeklog\\Input::fPost('active');\n    $active = $active === 1 ? 1 : 0;\n\n    if ($menuId > 0) {\n        DB_query("UPDATE {$_TABLES['menu']} SET menu_active=" . $active . " WHERE id=" . $menuId);\n    }\n\n    MENU_CACHE_remove_instance('menu');\n}\n\n'''
          s = s[:start] + menu_fn + s[end:]

          # Dispatch keeps signatures compatible but uses the new targeted POST.
          s = s.replace("MENU_changeActiveStatusElement(Geeklog\\Input::post('enableditem'));", "MENU_changeActiveStatusElement();")
          s = s.replace("MENU_changeActiveStatusMenu(Geeklog\\Input::post('enabledmenu'));", "MENU_changeActiveStatusMenu();")
          p.write_text(s)

          # Validate targeted activation refs just like move/delete refs.
          p = Path('admin_element_validation.php')
          s = p.read_text()
          s = s.replace("if ($mode !== 'move' && $mode !== 'delete' && $mode !== 'deletemenu') {", "if ($mode !== 'move' && $mode !== 'delete' && $mode !== 'deletemenu'\n        && $mode !== 'activate' && $mode !== 'menuactivate') {")
          s = s.replace("if ($mode === 'deletemenu') {", "if ($mode === 'deletemenu' || $mode === 'menuactivate') {")
          s = s.replace("        if (in_array((string) $menuName, array('navigation', 'footer', 'block'), true)) {\n            return 'This built-in menu cannot be deleted.';\n        }\n\n        return '';", "        if ($mode === 'deletemenu'\n            && in_array((string) $menuName, array('navigation', 'footer', 'block'), true)) {\n            return 'This built-in menu cannot be deleted.';\n        }\n        if ($mode === 'menuactivate') {\n            $active = isset($post['active']) ? (int) $post['active'] : -1;\n            if ($active !== 0 && $active !== 1) {\n                return 'Invalid menu activation state.';\n            }\n        }\n\n        return '';")
          s = s.replace("$menuId = $mode === 'move'\n        ? (isset($post['menu']) ? (int) $post['menu'] : 0)\n        : (isset($post['menuid']) ? (int) $post['menuid'] : 0);", "$menuId = ($mode === 'move' || $mode === 'activate')\n        ? (isset($post['menu']) ? (int) $post['menu'] : 0)\n        : (isset($post['menuid']) ? (int) $post['menuid'] : 0);")
          s = s.replace("    if ($mode === 'move') {\n        $where", "    if ($mode === 'activate') {\n        $active = isset($post['active']) ? (int) $post['active'] : -1;\n        if ($active !== 0 && $active !== 1) {\n            return 'Invalid menu element activation state.';\n        }\n    }\n\n    if ($mode === 'move') {\n        $where")
          p.write_text(s)

          # functions.inc must tolerate language not yet initialized while an
          # early request error page builds the Geeklog admin menu.
          p = Path('functions.inc')
          s = p.read_text()
          old = "    if (SEC_hasRights('menu.admin')) {\n        return array($LANG_MENU_1['plugin_name'],\n            $_CONF['site_admin_url'] . '/plugins/menu/index.php', 0);\n    }"
          new = "    if (SEC_hasRights('menu.admin')) {\n        $label = (isset($LANG_MENU_1) && is_array($LANG_MENU_1)\n            && isset($LANG_MENU_1['plugin_name']))\n            ? $LANG_MENU_1['plugin_name'] : 'Menu';\n        return array($label,\n            $_CONF['site_admin_url'] . '/plugins/menu/index.php', 0);\n    }"
          if old not in s:
              raise SystemExit('admin option pattern not found')
          s = s.replace(old, new)
          p.write_text(s)

      - name: Validate fixes
        run: |
          php -l admin/index.php
          php -l admin_element_validation.php
          php -l classes/classMenuElement2.php
          php -l functions.inc
          php tests/admin_security.php
          php tests/admin_element_validation.php
          ! grep -q '<form method="post" id="menusel"' templates/default/menutree.thtml
          ! grep -q '<form method="post" id="menusel"' templates/default/menulist.thtml
          grep -q 'name="mode" value="activate"' classes/classMenuElement2.php
          grep -q 'name="mode" value="menuactivate"' admin/index.php

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.php admin_element_validation.php classes/classMenuElement2.php functions.inc templates/default/menulist.thtml templates/default/menutree.thtml
          git commit -m "Fix Menu standalone POST mutation forms"
          git push origin HEAD:modernize-1.3.0
