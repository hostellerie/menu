name: Temporary fix Menu empty URL

on:
  push:
    branches:
      - modernize-1.3.0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0

      - name: Fix empty URL handling
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin/index.php')
          s = p.read_text()

          old = '''        case 6 :\n            $subtype = Geeklog\\Input::fPost('menuurl');\n            if ( strpos($subtype,"http") !== 0 && strpos($subtype,"%site") === false && $subtype[0] != '#' && rtrim($subtype) != '' ) {\n                $subtype = 'http://' . $subtype;\n            }\n            break;'''
          new = '''        case 6 :\n            $subtype = trim(Geeklog\\Input::fPost('menuurl'));\n            if ($subtype !== ''\n                && strpos($subtype, "http") !== 0\n                && strpos($subtype, "%site") === false\n                && $subtype[0] != '#') {\n                $subtype = 'http://' . $subtype;\n            }\n            break;'''
          if old not in s:
              raise SystemExit('edit subtype URL pattern not found')
          s = s.replace(old, new, 1)

          old = '''    if (strpos($url,"http") !== 0 && strpos($url,"%site") === false && $url[0] != '#' && rtrim($url) != '') {\n        $url = 'http://' . $url;\n    }'''
          new = '''    if ($url !== ''\n        && strpos($url, "http") !== 0\n        && strpos($url, "%site") === false\n        && $url[0] != '#') {\n        $url = 'http://' . $url;\n    }'''
          if old not in s:
              raise SystemExit('edit element URL pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Validate fix
        run: |
          php -l admin/index.php
          ! grep -q '&& $url\[0\].*rtrim($url)' admin/index.php

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.php
          git commit -m "Fix empty URL handling when saving Menu elements"
          git push origin HEAD:modernize-1.3.0
