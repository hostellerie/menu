name: Temporary legacy CSS hardening

on:
  push:
    branches:
      - modernize-1.3.0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
          fetch-depth: 0

      - name: Apply legacy CSS hardening
        run: python3 .github/scripts/harden_legacy_css.py

      - name: Validate
        shell: bash
        run: |
          set -e
          php -l css_security.php
          php -l storage.php
          php -l functions.inc
          php -l admin/index.php
          php -l admin/preview.php
          php tests/css_security_contract.php
          ! grep -RIn 'url({site_url}/images/menu/{menu_parent_filename})' templates/gl_vertical-cascading.thtml templates/default/gl_vertical-cascading.thtml
          ! grep -n 'site_url.*images/menu.*menu_bg_filename' functions.inc

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage.php functions.inc admin/index.php admin/preview.php templates/gl_vertical-cascading.thtml templates/default/gl_vertical-cascading.thtml ROADMAP.md
          git commit -m "Harden legacy Menu CSS rendering"
          git push origin HEAD:modernize-1.3.0
