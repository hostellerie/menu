name: Temporary submenu editor migration

on:
  push:
    branches:
      - modernize-1.3.0
    paths:
      - .github/workflows/temp-fix-submenu-editor.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - name: Apply submenu editor patch
        run: python3 tools/temp_fix_submenu_editor.py
      - name: Validate PHP syntax
        run: php -l admin/index.php
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.php
          git commit -m "Restore submenu creation and editing" || exit 0
          git push origin HEAD:modernize-1.3.0
