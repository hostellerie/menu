name: Temporary consolidate Menu element class

on:
  push:
    branches:
      - modernize-1.3.0

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
          fetch-depth: 0
      - name: Consolidate class files
        run: |
          cp classes/classMenuElement2.php classes/classMenuElement.php
          python3 -c "from pathlib import Path; p=Path('functions.inc'); s=p.read_text(); old=\"if (VERSION >= '2.0.0') {\\n    require_once \\$_CONF['path'].'plugins/menu/classes/classMenuElement2.php';\\n} else {\\n    require_once \\$_CONF['path'].'plugins/menu/classes/classMenuElement.php';\\n}\"; new=\"require_once \\$_CONF['path'] . 'plugins/menu/classes/classMenuElement.php';\"; assert old in s; p.write_text(s.replace(old,new,1))"
          git rm classes/classMenuElement2.php
      - name: Validate
        run: |
          php -l classes/classMenuElement.php
          php -l functions.inc
          test ! -e classes/classMenuElement2.php
          ! grep -R "classMenuElement2.php" --exclude-dir=.git --exclude='tmp-consolidate-menu-class.yml' .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classes/classMenuElement.php functions.inc
          git commit -m "Consolidate Menu element class implementation"
          git push origin HEAD:modernize-1.3.0
