name: Temporary consolidate Menu element class

on:
  push:
    branches:
      - modernize-1.3.0

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
          fetch-depth: 0
      - name: Consolidate class files
        run: |
          cp classes/classMenuElement2.php classes/classMenuElement.php
          python3 - <<'PY'
          from pathlib import Path
          p = Path('functions.inc')
          s = p.read_text()
          old = """if (VERSION >= '2.0.0') {
              require_once $_CONF['path'].'plugins/menu/classes/classMenuElement2.php';
          } else {
              require_once $_CONF['path'].'plugins/menu/classes/classMenuElement.php';
          }"""
          new = "require_once $_CONF['path'] . 'plugins/menu/classes/classMenuElement.php';"
          if old not in s:
              raise SystemExit('versioned class include block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('ROADMAP.md')
          s = p.read_text()
          s = s.replace('- [ ] Review the duplicated `classMenuElement.php` / `classMenuElement2.php` implementation.', '- [x] Consolidate the duplicated Menu element class implementation into `classMenuElement.php`.')
          s = s.replace('- [ ] Remove the legacy class only after supported Geeklog versions no longer need it.', '- [x] Remove the legacy pre-Geeklog-2 class split now that 1.3.0 supports Geeklog 2.1.1 through 2.2.2.')
          p.write_text(s)
          PY
          git rm classes/classMenuElement2.php
      - name: Validate
        run: |
          php -l classes/classMenuElement.php
          php -l functions.inc
          test ! -e classes/classMenuElement2.php
          ! grep -R "classMenuElement2.php" --exclude-dir=.git --exclude='tmp-consolidate-menu-class.yml' --exclude='ROADMAP.md' .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classes/classMenuElement.php functions.inc ROADMAP.md
          git commit -m "Consolidate Menu element class implementation"
          git push origin HEAD:modernize-1.3.0
