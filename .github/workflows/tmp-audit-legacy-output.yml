name: Temporary legacy output audit

on:
  push:
    branches:
      - modernize-1.3.0

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - name: Audit output and CSS sinks
        run: python3 .github/scripts/audit_legacy_output.py
