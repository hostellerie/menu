name: Temporary Menu image preview fix

on:
  push:
    branches:
      - modernize-1.3.0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/fix_image_previews.py
      - name: Validate
        run: |
          php -l admin/index.php
          php -l image_upload.php
          ! grep -RIn 'site_url}/images/menu/{menu_' templates/default/menuconfig.thtml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.php templates/default/menuconfig.thtml
          git commit -m "Avoid broken legacy Menu image previews"
          git push origin HEAD:modernize-1.3.0
