name: Temporary Phase 7 roadmap update

on:
  push:
    branches: [modernize-1.3.0]
    paths:
      - .github/workflows/temp-update-roadmap-phase7.yml
      - tools/temp_update_roadmap_phase7.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - run: python3 tools/temp_update_roadmap_phase7.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "Update Phase 7 modernization roadmap" || exit 0
          git push origin HEAD:modernize-1.3.0
