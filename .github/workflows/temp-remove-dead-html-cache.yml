name: Temporary dead HTML cache cleanup

on:
  push:
    branches: [modernize-1.3.0]
    paths:
      - .github/workflows/temp-remove-dead-html-cache.yml
      - tools/temp_remove_dead_html_cache.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - run: python3 tools/temp_remove_dead_html_cache.py
      - run: php -l functions.inc
      - run: php tests/html_cache_contract.php
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions.inc
          git commit -m "Remove unsafe dead HTML menu cache" || exit 0
          git push origin HEAD:modernize-1.3.0
