name: Temporary tree UI patch

on:
  push:
    branches: [modernize-1.3.0]
    paths:
      - .github/workflows/temp-fix-tree-ui.yml
      - tools/temp_fix_tree_ui.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - run: python3 tools/temp_fix_tree_ui.py
      - run: php -l classes/classMenuElement.php && php -l admin_element_views.php
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classes/classMenuElement.php admin_element_views.php
          git commit -m "Fix Menu tree drag loading and info tooltip" || exit 0
          git push origin HEAD:modernize-1.3.0
