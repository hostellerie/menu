name: Temporary hierarchy cycle guard

on:
  push:
    branches: [modernize-1.3.0]
    paths:
      - .github/workflows/temp-hierarchy-cycle.yml
      - tools/temp_hierarchy_cycle_guard.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - run: python3 tools/temp_hierarchy_cycle_guard.py
      - run: php -l admin_element_validation.php && php -l admin_element_views.php && php -l tests/hierarchy_cycle_contract.php
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin_element_validation.php admin_element_views.php tests/hierarchy_cycle_contract.php
          git commit -m "Prevent Menu hierarchy cycles" || exit 0
          git push origin HEAD:modernize-1.3.0
