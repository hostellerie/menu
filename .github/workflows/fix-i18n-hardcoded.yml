name: Fix hardcoded admin strings

on:
  push:
    branches:
      - modernize-1.4.0
    paths:
      - '.github/workflows/fix-i18n-hardcoded.yml'

permissions:
  contents: write

jobs:
  fix-i18n:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Replace hardcoded UI strings with language keys
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          views_path = Path('admin_element_views.php')
          lang_path = Path('language/english.php')

          views = views_path.read_text()
          lang = lang_path.read_text()

          replacements = {
              "'<strong>Menu</strong>' . ':&nbsp;<select name=\"menu\" onchange=\"submit()\">'":
                  "'<strong>' . MENU_escapeHTML($LANG_MENU00['menulabel']) . '</strong>' . ':&nbsp;<select name=\"menu\" onchange=\"submit()\">'",
              "'&nbsp;<input type=\"submit\" value=\"' . 'go' . '\"' . XHTML . '>'":
                  "'&nbsp;<input type=\"submit\" value=\"' . MENU_escapeHTML($LANG_MENU01['go']) . '\"' . XHTML . '>'",
              "'text' => 'Back to ' . $safeMenuName":
                  "'text' => MENU_escapeHTML($LANG_MENU01['back_to']) . ' ' . $safeMenuName",
              "$LANG_MENU01['edit_element'] .' for ' . $safeMenuName":
                  "$LANG_MENU01['edit_element'] . ' ' . $LANG_MENU01['for'] . ' ' . $safeMenuName",
              "'/plugins/menu/index.php\">Menu List</a> :: <a href=\"'":
                  "'/plugins/menu/index.php\">' . MENU_escapeHTML($LANG_MENU01['menu_list']) . '</a> :: <a href=\"'",
              "</a> :: Edit Element'":
                  "</a> :: ' . MENU_escapeHTML($LANG_MENU01['edit_element'])",
              "$LANG_MENU01['menu_colors'] .' for ' . $safeMenuName":
                  "$LANG_MENU01['menu_colors'] . ' ' . $LANG_MENU01['for'] . ' ' . $safeMenuName",
              "'/plugins/menu/index.php\">Menu List</a> :: ' . $safeMenuName . ' :: Configuration'":
                  "'/plugins/menu/index.php\">' . MENU_escapeHTML($LANG_MENU01['menu_list']) . '</a> :: ' . $safeMenuName . ' :: ' . MENU_escapeHTML($LANG_MENU01['configuration'])",
          }

          for old, new in replacements.items():
              if old not in views:
                  raise SystemExit('Expected hardcoded fragment not found: ' + old)
              views = views.replace(old, new)

          if "'go'" not in lang or "'back_to'" not in lang or "'for'" not in lang:
              topic_pattern = re.compile(r"^(\s*'topic'\s*=>\s*'Topics',\s*)$", re.MULTILINE)
              match = topic_pattern.search(lang)
              if not match:
                  raise SystemExit('Language insertion anchor not found')
              additions = (
                  "    'go'                => 'Go',\n"
                  "    'back_to'           => 'Back to',\n"
                  "    'for'               => 'for',\n"
              )
              lang = lang[:match.end()] + "\n" + additions + lang[match.end():]

          forbidden = [
              '<strong>Menu</strong>',
              "'Back to '",
              '>Menu List</a>',
              ':: Edit Element',
              " .' for ' ",
              "'go' . '\"'",
              ":: Configuration'",
          ]
          leftovers = [item for item in forbidden if item in views]
          if leftovers:
              raise SystemExit('Hardcoded UI fragments remain: ' + ', '.join(leftovers))

          views_path.write_text(views)
          lang_path.write_text(lang)
          PY

      - name: PHP syntax check
        run: |
          php -l admin_element_views.php
          php -l language/english.php

      - name: Commit cleanup
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin_element_views.php language/english.php
          git diff --cached --check
          git commit -m "fix: move admin UI strings to English language file"
          git push
