name: Temporary require jQuery

on:
  push:
    branches: [modernize-1.3.0]
    paths:
      - .github/workflows/temp-require-jquery.yml
      - tools/temp_require_jquery.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - run: python3 tools/temp_require_jquery.py
      - run: php -l admin_element_views.php
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin_element_views.php
          git commit -m "Require jQuery for Menu tree ordering" || exit 0
          git push origin HEAD:modernize-1.3.0
