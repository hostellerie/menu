name: Temporary restore resolved tree helpers

on:
  push:
    branches:
      - modernize-1.3.0

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
          fetch-depth: 0

      - name: Restore complete resolved tree implementation
        run: |
          git show 709dded1ee5d24e5698cd493cb42980c9b064d40:resolved_tree.php > resolved_tree.php
          python3 - <<'PY'
          from pathlib import Path
          p = Path('resolved_tree.php')
          s = p.read_text()
          needle = "require_once __DIR__ . '/resolved_admin.php';"
          replacement = "require_once __DIR__ . '/runtime_config.php';\nrequire_once __DIR__ . '/resolved_admin.php';"
          if needle not in s:
              raise SystemExit('resolved_admin require not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s)

          p = Path('tests/resolved_tree.php')
          s = p.read_text()
          needle = "$Menus = array();"
          replacement = "$_MENU_CONF = array(\n    'allow_php_elements' => true,\n    'accessibility_markup' => true,\n    'external_link_protection' => true,\n);\n$Menus = array();"
          if needle not in s:
              raise SystemExit('test setup marker not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY

      - name: Validate restored resolved tree
        run: |
          php -l resolved_tree.php
          php -l tests/resolved_tree.php
          php tests/resolved_tree.php
          php tests/runtime_config.php

      - name: Commit restored implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resolved_tree.php tests/resolved_tree.php
          git commit -m "Restore complete resolved tree helpers"
          git push origin HEAD:modernize-1.3.0
