name: Apply Menu autotag asset preflight fix

on:
  push:
    branches: [modernize-1.4.0]
    paths:
      - '.github/workflows/apply-menu-footer-asset-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('asset_usage.php')
          s = p.read_text()
          anchor = "/**\n * Check whether the active theme source references a historical Menu variable."
          insert = r'''/**
 * Extract Menu autotag names from a string.
 *
 * @param string $value
 * @return array
 */
function MENU_extractAutotagMenuNames($value)
{
    $names = array();
    if (!is_string($value) || strpos($value, '[menu:') === false) {
        return $names;
    }

    if (preg_match_all('/\\[menu:([^\\]]+)\\]/i', $value, $matches)) {
        foreach ($matches[1] as $name) {
            $name = trim($name);
            if ($name !== '' && !in_array($name, $names, true)) {
                $names[] = $name;
            }
        }
    }

    return $names;
}

/**
 * Return Menu autotags already present in assigned Template values.
 *
 * This is a pre-head inspection of template state, not a scan of final HTML.
 * It catches values such as configured footer text that contains [menu:footer]
 * before Geeklog expands that autotag during final template rendering.
 *
 * @param object $template
 * @return array
 */
function MENU_templateAssignedAutotagMenuNames(&$template)
{
    $names = array();
    if (!is_object($template) || !method_exists($template, 'get_vars')) {
        return $names;
    }

    $values = $template->get_vars();
    if (!is_array($values)) {
        return $names;
    }

    foreach ($values as $value) {
        foreach (MENU_extractAutotagMenuNames($value) as $name) {
            if (!in_array($name, $names, true)) {
                $names[] = $name;
            }
        }
    }

    return $names;
}

/**
 * Return Menu autotags present directly in the active theme source.
 *
 * @param string $templateName
 * @param object $template
 * @return array
 */
function MENU_templateSourceAutotagMenuNames($templateName, &$template)
{
    global $_CONF;

    $fileNames = array();
    if (MENU_supportsDemandAssetLoading()) {
        if ($templateName === 'header' || $templateName === 'footer') {
            $fileNames[] = 'index.thtml';
        }
    } elseif ($templateName === 'header') {
        $fileNames[] = 'header.thtml';
    } elseif ($templateName === 'footer') {
        $fileNames[] = 'footer.thtml';
    }

    if (empty($fileNames)) {
        return array();
    }

    $roots = array();
    if (is_object($template) && method_exists($template, 'getRoot')) {
        $templateRoots = $template->getRoot();
        if (!is_array($templateRoots)) {
            $templateRoots = array($templateRoots);
        }
        foreach ($templateRoots as $root) {
            if (is_string($root) && $root !== '') {
                $roots[] = $root;
            }
        }
    }
    if (isset($_CONF['path_layout']) && $_CONF['path_layout'] !== '') {
        $roots[] = $_CONF['path_layout'];
    }
    if (isset($_CONF['path_layout_default']) && $_CONF['path_layout_default'] !== '') {
        $roots[] = $_CONF['path_layout_default'];
    }
    $roots = array_unique($roots);

    foreach ($fileNames as $fileName) {
        foreach ($roots as $root) {
            $path = rtrim($root, "/\\") . DIRECTORY_SEPARATOR . $fileName;
            if (!is_file($path) || !is_readable($path)) {
                continue;
            }
            $source = file_get_contents($path);
            if ($source === false) {
                continue;
            }
            return MENU_extractAutotagMenuNames($source);
        }
    }

    return array();
}

'''
          if anchor not in s:
              raise SystemExit('asset_usage anchor not found')
          if 'function MENU_templateAssignedAutotagMenuNames' not in s:
              s = s.replace(anchor, insert + anchor, 1)
          p.write_text(s)

          p = Path('functions.inc')
          s = p.read_text()
          old = """    if ($templatename === 'header') {\n        if (MENU_templateUsesVariable('header', $template, 'header_navigation')) {\n"""
          new = """    if ($templatename === 'header') {\n        $preflightMenuNames = array_merge(\n            MENU_templateAssignedAutotagMenuNames($template),\n            MENU_templateSourceAutotagMenuNames('header', $template),\n            MENU_templateSourceAutotagMenuNames('footer', $template)\n        );\n        foreach (array_unique($preflightMenuNames) as $preflightMenuName) {\n            MENU_registerNamedAssetUsage($preflightMenuName);\n        }\n\n        if (MENU_templateUsesVariable('header', $template, 'header_navigation')) {\n"""
          if old not in s:
              raise SystemExit('functions preflight anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/template_usage_modern.php')
          s = p.read_text()
          old = """class MenuModernTemplateFixture\n{\n    private $root;\n\n    public function __construct($root)\n    {\n        $this->root = $root;\n    }\n\n    public function getRoot()\n    {\n        return array($this->root);\n    }\n}\n"""
          new = """class MenuModernTemplateFixture\n{\n    private $root;\n    private $values;\n\n    public function __construct($root, $values = array())\n    {\n        $this->root = $root;\n        $this->values = $values;\n    }\n\n    public function getRoot()\n    {\n        return array($this->root);\n    }\n\n    public function get_vars()\n    {\n        return $this->values;\n    }\n}\n"""
          if old not in s:
              raise SystemExit('modern fixture anchor not found')
          s = s.replace(old, new, 1)
          marker = """menu_template_modern_assert(\n    MENU_templateUsesVariable('footer', $template, 'menu_footer'),\n    'Geeklog 2.2.2 menu_footer should be detected in index.thtml'\n);\n"""
          add = marker + """\nfile_put_contents(\n    $dir . DIRECTORY_SEPARATOR . 'index.thtml',\n    '<html><footer>[menu:footer]</footer></html>'\n);\nmenu_template_modern_assert(\n    MENU_templateSourceAutotagMenuNames('header', $template) === array('footer'),\n    'Geeklog 2.2.2 direct [menu:footer] should be found before header generation'\n);\n\n$templateWithAssignedFooter = new MenuModernTemplateFixture(\n    $dir,\n    array('footer_text' => '<div>[menu:footer]</div>')\n);\nmenu_template_modern_assert(\n    MENU_templateAssignedAutotagMenuNames($templateWithAssignedFooter) === array('footer'),\n    'Geeklog 2.2.2 assigned footer value should expose [menu:footer] before header generation'\n);\n"""
          if marker not in s:
              raise SystemExit('modern test marker not found')
          s = s.replace(marker, add, 1)
          p.write_text(s)

          p = Path('tests/render_assets.php')
          s = p.read_text()
          marker = """menu_render_test_assert(\n    strpos($functions, 'MENU_registerAssetUsage($menuID);') !== false,\n    'MENU_getMenu must register usage after its active/permission gate'\n);\n"""
          add = marker + """menu_render_test_assert(\n    strpos($functions, 'MENU_templateAssignedAutotagMenuNames($template)') !== false,\n    'header preflight must inspect assigned template values for Menu autotags'\n);\nmenu_render_test_assert(\n    strpos($functions, \"MENU_templateSourceAutotagMenuNames('header', $template)\") !== false,\n    'header preflight must inspect active theme source for Menu autotags'\n);\n"""
          if marker not in s:
              raise SystemExit('render_assets marker not found')
          s = s.replace(marker, add, 1)
          p.write_text(s)
          PY

      - name: Validate targeted tests
        run: |
          php -l asset_usage.php
          php -l functions.inc
          php tests/asset_usage.php
          php tests/template_usage_modern.php
          php tests/template_usage_legacy.php
          php tests/render_assets.php
          php tests/slicknav_legacy_contract.php

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset_usage.php functions.inc tests/template_usage_modern.php tests/render_assets.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: preflight Menu autotags before header assets"
          git push origin HEAD:modernize-1.4.0
