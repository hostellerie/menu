name: Temporary admin view escaping

on:
  push:
    branches: [modernize-1.3.0]
    paths:
      - .github/workflows/temp-admin-view-escaping.yml
      - tools/temp_admin_view_escaping.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - run: python3 tools/temp_admin_view_escaping.py
      - run: php -l admin_element_views.php && php -l tests/admin_view_escaping_contract.php
      - run: php tests/admin_view_escaping_contract.php
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin_element_views.php tests/admin_view_escaping_contract.php
          git commit -m "Escape stored menu names in admin views" || exit 0
          git push origin HEAD:modernize-1.3.0
