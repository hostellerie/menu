name: Temporary cache cleanup

on:
  push:
    branches: [modernize-1.3.0]
    paths:
      - .github/workflows/temp-cache-cleanup.yml
      - tools/temp_cache_cleanup.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - run: python3 tools/temp_cache_cleanup.py
      - run: php -l admin/index.php
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.php
          git commit -m "Centralize Menu admin cache invalidation" || exit 0
          git push origin HEAD:modernize-1.3.0
