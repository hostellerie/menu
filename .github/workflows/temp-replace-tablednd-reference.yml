name: Temporary tableDnD reference cleanup

on:
  push:
    branches: [modernize-1.3.0]
    paths:
      - .github/workflows/temp-replace-tablednd-reference.yml
      - tools/temp_replace_tablednd_reference.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - run: python3 tools/temp_replace_tablednd_reference.py
      - run: php -l admin/index.php
      - run: php tests/legacy_admin_assets.php
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.php
          git commit -m "Use native Menu ordering script" || exit 0
          git push origin HEAD:modernize-1.3.0
