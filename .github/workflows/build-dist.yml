name: Build installable archive

on:
  push:
    branches:
      - modernize-1.4.0
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Validate language files
        shell: bash
        run: |
          set -euo pipefail
          php -l functions.inc
          php -l language/english.php
          php -l language/french_france_utf-8.php
          php -l language/persian_utf-8.php
          php tests/language_contract.php

      - name: Build Geeklog installable archive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build/menu dist

          rsync -a ./ build/menu/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude 'dist/'

          rm -f dist/menu-1.4.0.zip
          (
            cd build
            zip -q -r ../dist/menu-1.4.0.zip menu
          )

          rm -rf build

          test -s dist/menu-1.4.0.zip
          echo "Archive created: dist/menu-1.4.0.zip"
          echo "Archive size: $(stat -c%s dist/menu-1.4.0.zip) bytes"
          unzip -t dist/menu-1.4.0.zip
          unzip -l dist/menu-1.4.0.zip | head -n 40

      - name: Upload installable archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: menu-1.4.0
          path: dist/menu-1.4.0.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Commit archive to dist
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- dist/menu-1.4.0.zip && git ls-files --error-unmatch dist/menu-1.4.0.zip >/dev/null 2>&1; then
            echo "Archive is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/menu-1.4.0.zip
          git commit -m "build: update Menu 1.4.0 installable archive"
          git pull --rebase origin modernize-1.4.0
          git push origin HEAD:modernize-1.4.0
