name: Build installable archive

on:
  push:
    branches:
      - modernize-1.4.0
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Apply language migration
        shell: bash
        run: |
          set -euo pipefail
          php tools/apply-language-runtime.php
          php -l functions.inc
          php -l language/english.php
          php -l language/french_france_utf-8.php
          php -l language/persian_utf-8.php
          php tests/language_contract.php

      - name: Build Geeklog installable archive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build/menu dist

          rsync -a ./ build/menu/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude 'dist/'

          rm -f dist/menu-1.4.0.zip
          (
            cd build
            zip -q -r ../dist/menu-1.4.0.zip menu
          )

          rm -rf build

          echo "Archive created: dist/menu-1.4.0.zip"
          unzip -l dist/menu-1.4.0.zip | head -n 40

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add functions.inc language/persian_utf-8.php dist/menu-1.4.0.zip

          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            exit 0
          fi

          git diff --cached --check
          git commit -m "build: apply language fallback and refresh Menu 1.4.0 archive"
          git pull --rebase origin modernize-1.4.0
          git push origin HEAD:modernize-1.4.0
