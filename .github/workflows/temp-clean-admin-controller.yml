name: Temporary admin controller cleanup

on:
  push:
    branches: [modernize-1.3.0]
    paths:
      - .github/workflows/temp-clean-admin-controller.yml
      - tools/temp_clean_admin_controller.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - run: python3 tools/temp_clean_admin_controller.py
      - run: php -l admin/index.php && php -l tests/admin_controller_contract.php
      - run: php tests/admin_controller_contract.php
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.php tests/admin_controller_contract.php
          git commit -m "Finish admin controller cleanup" || exit 0
          git push origin HEAD:modernize-1.3.0
