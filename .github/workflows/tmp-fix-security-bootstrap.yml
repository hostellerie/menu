name: Temporary fix Menu security bootstrap

on:
  push:
    branches:
      - modernize-1.3.0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0

      - name: Move security enforcement after plugin bootstrap
        shell: python
        run: |
          from pathlib import Path

          p = Path('admin_security.php')
          s = p.read_text()
          old = "\nif (MENU_adminIsControllerRequest()) {\n    MENU_adminEnforceCsrf();\n}\n"
          if old not in s:
              raise SystemExit('automatic enforcement block not found')
          s = s.replace(old, "\n")
          p.write_text(s)

          p = Path('admin/index.php')
          s = p.read_text()
          marker = "if (!SEC_hasRights('menu.admin')) {\n"
          pos = s.index(marker)
          # Run request protection only after lib-common has completely loaded
          # plugin functions, language, configuration and table aliases.
          insert = "MENU_adminEnforceCsrf();\n\n"
          if insert not in s[:pos]:
              s = s[:pos] + insert + s[pos:]
          p.write_text(s)

          p = Path('functions.inc')
          s = p.read_text()
          old = "function plugin_templatesetvars_menu($templatename, &$template)\n{\n    if (!DB_checkTableExists('menu')) return;"
          new = "function plugin_templatesetvars_menu($templatename, &$template)\n{\n    global $_TABLES;\n\n    if (!isset($_TABLES['menu']) || !DB_checkTableExists('menu')) {\n        return;\n    }"
          if old not in s:
              raise SystemExit('template hook pattern not found')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('tests/admin_security.php')
          s = p.read_text()
          anchor = "require_once dirname(__DIR__) . '/admin_security.php';\n"
          if anchor not in s:
              raise SystemExit('security test include not found')
          addition = "\nmenu_security_assert_placeholder = true;\n"
          # No top-level execution is allowed merely by including helper.
          # Test structurally because calling enforcement would exit on failures.
          if "file_get_contents(dirname(__DIR__) . '/admin_security.php')" not in s:
              check = "\n$securitySource = file_get_contents(dirname(__DIR__) . '/admin_security.php');\n"
              check += "if (preg_match('/if\\s*\\(MENU_adminIsControllerRequest\\(\\)\\)\\s*\\{\\s*MENU_adminEnforceCsrf\\(\\);/s', $securitySource)) {\n"
              check += "    fwrite(STDERR, 'FAIL: admin_security.php must not auto-enforce during include' . PHP_EOL);\n    exit(1);\n}\n"
              s = s.replace(anchor, anchor + check)
          p.write_text(s)

      - name: Validate bootstrap fix
        run: |
          php -l admin_security.php
          php -l admin/index.php
          php -l functions.inc
          php -l tests/admin_security.php
          php tests/admin_security.php
          ! grep -q "if (MENU_adminIsControllerRequest())" admin_security.php
          grep -q "MENU_adminEnforceCsrf();" admin/index.php
          grep -q "isset(\$_TABLES\['menu'\])" functions.inc

      - name: Commit bootstrap fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin_security.php admin/index.php functions.inc tests/admin_security.php
          git commit -m "Fix Menu security bootstrap ordering"
          git push origin HEAD:modernize-1.3.0
