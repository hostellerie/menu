name: Temporary cache module extraction

on:
  push:
    branches: [modernize-1.3.0]
    paths:
      - .github/workflows/temp-extract-cache-module.yml
      - tools/temp_extract_cache_module.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - run: python3 tools/temp_extract_cache_module.py
      - run: php -l functions.inc && php -l cache.php
      - run: php tests/cache_module_contract.php
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions.inc
          git commit -m "Extract Menu cache infrastructure" || exit 0
          git push origin HEAD:modernize-1.3.0
