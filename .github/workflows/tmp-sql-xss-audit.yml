name: Temporary Menu SQL XSS hardening

on:
  push:
    branches:
      - modernize-1.3.0

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
          fetch-depth: 0

      - name: Apply SQL and XSS hardening
        run: python3 .github/scripts/sql_xss_harden.py

      - name: Validate PHP 8.1
        run: |
          php -l compat.php
          php -l functions.inc
          php -l classes/classMenuElement.php
          php -l admin/index.php
          php -l tests/sql_xss_contract.php
          php tests/sql_xss_contract.php

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compat.php functions.inc classes/classMenuElement.php admin/index.php tests/sql_xss_contract.php
          git commit -m "Harden Menu SQL writes and HTML output"
          git push origin HEAD:modernize-1.3.0
