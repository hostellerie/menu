name: Temporary Menu SQL XSS final pass

on:
  push:
    branches:
      - modernize-1.3.0

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
          fetch-depth: 0

      - name: Apply final SQL and XSS hardening
        run: python3 .github/scripts/sql_xss_finish.py

      - name: Validate PHP and contract
        run: |
          php -l compat.php
          php -l functions.inc
          php -l classes/classMenuElement.php
          php -l admin/index.php
          php -l tests/sql_xss_contract.php
          php tests/sql_xss_contract.php

      - name: Audit remaining SQL and HTML sinks
        run: |
          echo '=== Remaining SQL writes ==='
          grep -RInE 'DB_(query|save|getItem)\(' --include='*.php' --include='*.inc' admin classes functions.inc | grep -vE 'SELECT MAX\(id\)|pi_version' || true
          echo '=== Raw dynamic legacy link pattern ==='
          ! grep -RIn "<li><a href=\\\"' . \$url . '\\\">' . \$label" classes/classMenuElement.php

      - name: Commit final hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classes/classMenuElement.php admin/index.php tests/sql_xss_contract.php
          git commit -m "Finish Menu SQL and XSS hardening"
          git push origin HEAD:modernize-1.3.0
