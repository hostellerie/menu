name: Temporary Menu SQL XSS hardening

on:
  push:
    branches:
      - modernize-1.3.0

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
          fetch-depth: 0

      - name: Harden SQL and HTML output
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual < count:
                  raise SystemExit('%s: expected at least %d occurrence(s), found %d for %r' % (path, count, actual, old[:80]))
              p.write_text(s.replace(old, new, count))

          # Shared compatibility-safe escaping helpers.
          p = Path('compat.php')
          s = p.read_text()
          marker = "\n    if (!function_exists('COM_redirect')) {"
          if marker not in s:
              raise SystemExit('compat marker not found')
          helpers = r'''
    if (!function_exists('MENU_dbEscape')) {
        function MENU_dbEscape($value)
        {
            return DB_escapeString((string) $value);
        }
    }

    if (!function_exists('MENU_escapeHTML')) {
        function MENU_escapeHTML($value)
        {
            return htmlspecialchars((string) $value, ENT_QUOTES, 'UTF-8');
        }
    }

    /*
     * Menu 1.2.x stored some element labels already HTML-encoded. Decode one
     * legacy layer before escaping for output so upgrades remain visually
     * compatible while raw database values can never become markup.
     */
    if (!function_exists('MENU_escapeStoredText')) {
        function MENU_escapeStoredText($value)
        {
            return MENU_escapeHTML(htmlspecialchars_decode((string) $value, ENT_QUOTES));
        }
    }

    if (!function_exists('MENU_safeHref')) {
        function MENU_safeHref($url, $fallback = '#')
        {
            $url = trim((string) $url);
            if ($url === '') {
                return MENU_escapeHTML($fallback);
            }

            $decoded = html_entity_decode($url, ENT_QUOTES, 'UTF-8');
            if (preg_match('/^[\\x00-\\x20]*(?:javascript|vbscript|data):/i', $decoded)) {
                return MENU_escapeHTML($fallback);
            }

            return MENU_escapeHTML($url);
        }
    }
'''
          s = s.replace(marker, '\n' + helpers + marker, 1)
          p.write_text(s)

          # Make the element persistence sink safe and numeric fields explicit.
          p = Path('classes/classMenuElement.php')
          s = p.read_text()
          old = '''    function saveElement( ) {
        global $_TABLES, $Menus;

        $this->label            = $this->label;
        $this->url              = $this->url;

        $sqlFieldList  = 'id,pid,menu_id,element_label,element_type,element_subtype,element_order,element_active,element_url,element_target,group_id';
        $sqlDataValues = "$this->id,$this->pid,'".$this->menu_id."','$this->label',$this->type,'$this->subtype',$this->order,$this->active,'$this->url','$this->target',$this->group_id";
        DB_save($_TABLES['menu_elements'], $sqlFieldList, $sqlDataValues);
    }
'''
          new = '''    function saveElement( ) {
        global $_TABLES;

        $id       = (int) $this->id;
        $pid      = (int) $this->pid;
        $menuId   = (int) $this->menu_id;
        $type     = (int) $this->type;
        $order    = (int) $this->order;
        $active   = (int) $this->active;
        $groupId  = (int) $this->group_id;
        $label    = MENU_dbEscape($this->label);
        $subtype  = MENU_dbEscape($this->subtype);
        $url      = MENU_dbEscape($this->url);
        $target   = MENU_dbEscape($this->target);

        $sqlFieldList  = 'id,pid,menu_id,element_label,element_type,element_subtype,element_order,element_active,element_url,element_target,group_id';
        $sqlDataValues = $id . ',' . $pid . ',' . $menuId . ",'" . $label . "'," . $type . ",'" . $subtype . "'," . $order . ',' . $active . ",'" . $url . "','" . $target . "'," . $groupId;
        DB_save($_TABLES['menu_elements'], $sqlFieldList, $sqlDataValues);
    }
'''
          if old not in s:
              raise SystemExit('saveElement block not found')
          s = s.replace(old, new, 1)
          s = s.replace('strip_tags($this->label)', 'MENU_escapeStoredText($this->label)')
          s = s.replace("COM_getTooltip('<img src=\"' . $_CONF['site_admin_url'] . '/plugins/menu/images/info.png\" alt=\"\"' . XHTML . '>', $elementDetails, '', $this->label, $template = 'help')",
                        "COM_getTooltip('<img src=\"' . $_CONF['site_admin_url'] . '/plugins/menu/images/info.png\" alt=\"\"' . XHTML . '>', $elementDetails, '', MENU_escapeStoredText($this->label), $template = 'help')")
          s = s.replace("($this->url == '' ? '#' : $this->url)", "MENU_safeHref($this->url)")
          s = s.replace("'<a href=\"' . $this->url . '\"' . MENU_legacyLinkAttributes($this->url, $this->target)", "'<a href=\"' . MENU_safeHref($this->url) . '\"' . MENU_legacyLinkAttributes($this->url, $this->target)")
          p.write_text(s)

          # Escape autotag lookup input.
          replace('functions.inc',
                  "$id = DB_getItem($_TABLES['menu'],'id','menu_name=\"'.$menuID.'\"');",
                  "$menuIDSql = MENU_dbEscape($menuID);\n                $id = DB_getItem($_TABLES['menu'], 'id', 'menu_name=\"' . $menuIDSql . '\"');")

          # Keep element labels as plain text on new writes. Old encoded labels
          # remain supported by MENU_escapeStoredText().
          p = Path('admin/index.php')
          s = p.read_text()
          s = s.replace("htmlspecialchars(strip_tags(COM_checkWords(Geeklog\\Input::post('menulabel'))))",
                        "trim(strip_tags(COM_checkWords(Geeklog\\Input::post('menulabel'))))")

          # Clone menu SQL.
          s = s.replace("$sqlDataValues = \"'$menu_name',$menu_type,$menu_active,$group_id\";",
                        "$menuNameSql = MENU_dbEscape($menu_name);\n        $menu_type = (int) $menu_type;\n        $menu_active = (int) $menu_active;\n        $group_id = (int) $group_id;\n        $sqlDataValues = \"'$menuNameSql',$menu_type,$menu_active,$group_id\";")
          s = s.replace("DB_save($_TABLES['menu_config'],\"menu_id,conf_name,conf_value\",\"$menu_id,'\".$C['conf_name'].\"','\".$C['conf_value'].\"'\");",
                        "$confNameSql = MENU_dbEscape($C['conf_name']);\n            $confValueSql = MENU_dbEscape($C['conf_value']);\n            DB_save($_TABLES['menu_config'], 'menu_id,conf_name,conf_value', \"$menu_id,'$confNameSql','$confValueSql'\");")

          # New menu SQL.
          s = s.replace("$sqlDataValues = \"'$menuname',$menutype,$menuactive,$menugroup\";",
                        "$menunameSql = MENU_dbEscape($menuname);\n    $sqlDataValues = \"'$menunameSql',$menutype,$menuactive,$menugroup\";", 1)

          # Edit element SQL and ownership scoping.
          s = s.replace("$menu_id = Geeklog\\Input::fPost('menu');", "$menu_id = (int) Geeklog\\Input::fPost('menu');", 1)
          old_sql = "$sql = \"UPDATE {$_TABLES['menu_elements']} SET pid=$pid, element_order=$neworder, element_label='$label', element_type='$type', element_subtype='$subtype', element_active=$active, element_url='$url', element_target='$target', group_id=$group_id WHERE id=$id\";"
          new_sql = "$labelSql = MENU_dbEscape($label);\n    $subtypeSql = MENU_dbEscape($subtype);\n    $urlSql = MENU_dbEscape($url);\n    $targetSql = MENU_dbEscape($target);\n    $sql = \"UPDATE {$_TABLES['menu_elements']} SET pid=$pid, element_order=$neworder, element_label='$labelSql', element_type=$type, element_subtype='$subtypeSql', element_active=$active, element_url='$urlSql', element_target='$targetSql', group_id=$group_id WHERE id=$id AND menu_id=$menu_id\";"
          if old_sql not in s:
              raise SystemExit('edit element UPDATE not found')
          s = s.replace(old_sql, new_sql, 1)

          # Menu configuration SQL.
          old = "$sqlDataValues = \"$menu_id,'$menuname',$menutype,$menuactive,$menugroup\";\n    DB_save($_TABLES['menu'], $sqlFieldList, $sqlDataValues);\n\n    foreach ($mc AS $name => $value) {\n        DB_save($_TABLES['menu_config'],\"menu_id,conf_name,conf_value\",\"$menu_id,'$name','$value'\");\n    }"
          new = "$menunameSql = MENU_dbEscape($menuname);\n    $sqlDataValues = \"$menu_id,'$menunameSql',$menutype,$menuactive,$menugroup\";\n    DB_save($_TABLES['menu'], $sqlFieldList, $sqlDataValues);\n\n    foreach ($mc AS $name => $value) {\n        $nameSql = MENU_dbEscape($name);\n        $valueSql = MENU_dbEscape($value);\n        DB_save($_TABLES['menu_config'], 'menu_id,conf_name,conf_value', \"$menu_id,'$nameSql','$valueSql'\");\n    }"
          if old not in s:
              raise SystemExit('menu config save block not found')
          s = s.replace(old, new, 1)

          # Generated upload filenames are server-controlled, but still pass
          # through the same SQL escaping boundary.
          s = s.replace("DB_save($_TABLES['menu_config'],\"menu_id,conf_name,conf_value\",\"$menu_id,'menu_bg_filename','$newFilename'\");",
                        "$newFilenameSql = MENU_dbEscape($newFilename);\n                    DB_save($_TABLES['menu_config'], 'menu_id,conf_name,conf_value', \"$menu_id,'menu_bg_filename','$newFilenameSql'\");")
          s = s.replace("DB_save($_TABLES['menu_config'],\"menu_id,conf_name,conf_value\",\"$menu_id,'menu_hover_filename','$newFilename'\");",
                        "$newFilenameSql = MENU_dbEscape($newFilename);\n                    DB_save($_TABLES['menu_config'], 'menu_id,conf_name,conf_value', \"$menu_id,'menu_hover_filename','$newFilenameSql'\");")
          s = s.replace("DB_save($_TABLES['menu_config'],\"menu_id,conf_name,conf_value\",\"$menu_id,'menu_parent_filename','$newFilename'\");",
                        "$newFilenameSql = MENU_dbEscape($newFilename);\n                    DB_save($_TABLES['menu_config'], 'menu_id,conf_name,conf_value', \"$menu_id,'menu_parent_filename','$newFilenameSql'\");")

          # Harden drag-order parser: accept only mid_<positive integer> values
          # from the current menu and never interpolate uncast IDs.
          old = '''    $menu_id   = (int) Geeklog\\Input::fPost('menu_id');
    $orders = explode('&', $_POST['orders']);
    $array = array();
    
    foreach($orders as $item) {
        $item = explode('=', $item);
        $item = explode('_', $item[1]);
        $array[] = $item[1];
    }
    foreach($array as $key => $mid) {
            $key = ($key+1) * 10;
            DB_query("UPDATE {$_TABLES['menu_elements']} SET element_order=" . $key . " WHERE menu_id=" . $menu_id . " AND id=" . $mid);        
    }
    $pid = $Menus[$menu_id]['elements'][$mid]->pid;
'''
          new = '''    $menu_id = (int) Geeklog\\Input::fPost('menu_id');
    $orders = explode('&', (string) Geeklog\\Input::post('orders', ''));
    $array = array();

    foreach ($orders as $item) {
        $parts = explode('=', $item, 2);
        if (count($parts) !== 2) {
            continue;
        }
        $rowId = rawurldecode($parts[1]);
        if (!preg_match('/^mid_([1-9][0-9]*)$/', $rowId, $matches)) {
            continue;
        }
        $mid = (int) $matches[1];
        if (isset($Menus[$menu_id]['elements'][$mid])) {
            $array[] = $mid;
        }
    }

    foreach ($array as $key => $mid) {
        $newOrder = ((int) $key + 1) * 10;
        DB_query("UPDATE {$_TABLES['menu_elements']} SET element_order=" . $newOrder
            . " WHERE menu_id=" . $menu_id . " AND id=" . (int) $mid);
    }
'''
          if old not in s:
              raise SystemExit('drag reorder block not found')
          s = s.replace(old, new, 1)

          # Contextual HTML escaping for database-derived admin values.
          replacements = {
              ">' . $menu['menu_name'] .'</option>": ">' . MENU_escapeHTML($menu['menu_name']) .'</option>",
              ">' . $label . '</option>": ">' . MENU_escapeHTML($label) . '</option>",
              ">' . $topic . '</option>": ">' . MENU_escapeHTML($topic) . '</option>",
              ">' . $row['element_label'] . '</option>": ">' . MENU_escapeStoredText($row['element_label']) . '</option>",
              ">'.$Menus[$menu_id]['menu_name'].' :: ": ">'.MENU_escapeHTML($Menus[$menu_id]['menu_name']).' :: ",
              ">'.$Menus[$mid]['menu_name'].' :: Configuration':": ">'.MENU_escapeHTML($Menus[$mid]['menu_name']).' :: Configuration':",
              "'menu_name'         => $Menus[$mid]['menu_name'],": "'menu_name'         => MENU_escapeHTML($Menus[$mid]['menu_name']),",
              "'menulabel'        => $Menus[$menu_id]['elements'][$mid]->label,": "'menulabel'        => MENU_escapeStoredText($Menus[$menu_id]['elements'][$mid]->label),",
              "'menuurl'          => $Menus[$menu_id]['elements'][$mid]->url,": "'menuurl'          => MENU_escapeHTML($Menus[$menu_id]['elements'][$mid]->url),",
              "'phpfunction'      => $Menus[$menu_id]['elements'][$mid]->subtype,": "'phpfunction'      => MENU_escapeHTML($Menus[$menu_id]['elements'][$mid]->subtype),",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Attribute value containing disabled plugin subtype.
          s = s.replace("'<option value=\"'.$Menus[$menu_id]['elements'][$mid]->subtype.'\" selected=\"selected\">'",
                        "'<option value=\"'.MENU_escapeHTML($Menus[$menu_id]['elements'][$mid]->subtype).'\" selected=\"selected\">'")

          # Selected option labels for static pages/topics and parent/order lists.
          s = s.replace(". '>' . $label . '</option>'", ". '>' . MENU_escapeHTML($label) . '</option>'")
          s = s.replace(". '>' . $topic . '</option>'", ". '>' . MENU_escapeHTML($topic) . '</option>'")
          s = s.replace(". '>' . $row['element_label'] . '</option>'", ". '>' . MENU_escapeStoredText($row['element_label']) . '</option>'")

          p.write_text(s)
          PY

      - name: Add SQL XSS regression contract
        run: |
          cat > tests/sql_xss_contract.php <<'PHP'
          <?php
          function assertTrue($condition, $message)
          {
              if (!$condition) {
                  fwrite(STDERR, "FAIL: " . $message . PHP_EOL);
                  exit(1);
              }
          }

          define('VERSION', '2.2.2');
          function DB_escapeString($value) { return str_replace("'", "''", $value); }
          require dirname(__DIR__) . '/compat.php';

          assertTrue(MENU_dbEscape("O'Reilly") === "O''Reilly", 'SQL escape helper');
          assertTrue(MENU_escapeHTML('"<script>') === '&quot;&lt;script&gt;', 'HTML text/attribute escape');
          assertTrue(MENU_escapeStoredText('&lt;b&gt;x&lt;/b&gt;') === '&lt;b&gt;x&lt;/b&gt;', 'legacy stored label normalization');
          assertTrue(MENU_safeHref('javascript:alert(1)') === '#', 'javascript URL blocked');
          assertTrue(MENU_safeHref(' data:text/html,x') === '#', 'data URL blocked');
          assertTrue(MENU_safeHref('https://example.com/?a=1&b=2') === 'https://example.com/?a=1&amp;b=2', 'normal URL escaped');

          $class = file_get_contents(dirname(__DIR__) . '/classes/classMenuElement.php');
          $admin = file_get_contents(dirname(__DIR__) . '/admin/index.php');
          $functions = file_get_contents(dirname(__DIR__) . '/functions.inc');

          assertTrue(strpos($class, '$label    = MENU_dbEscape($this->label);') !== false, 'element label escaped at DB sink');
          assertTrue(strpos($class, 'MENU_safeHref($this->url)') !== false, 'legacy href uses safe URL helper');
          assertTrue(strpos($class, 'strip_tags($this->label)') === false, 'legacy label output no longer uses strip_tags alone');
          assertTrue(strpos($admin, "WHERE id=$id AND menu_id=$menu_id") !== false, 'element update scoped to menu');
          assertTrue(strpos($admin, "preg_match('/^mid_([1-9][0-9]*)$/', $rowId") !== false, 'drag IDs validated');
          assertTrue(strpos($functions, '$menuIDSql = MENU_dbEscape($menuID);') !== false, 'autotag menu name escaped');

          echo "SQL/XSS contract: OK\n";
          PHP

      - name: Validate PHP 8.1
        run: |
          php -l compat.php
          php -l functions.inc
          php -l classes/classMenuElement.php
          php -l admin/index.php
          php -l tests/sql_xss_contract.php
          php tests/sql_xss_contract.php

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compat.php functions.inc classes/classMenuElement.php admin/index.php tests/sql_xss_contract.php
          git commit -m "Harden Menu SQL writes and HTML output"
          git push origin HEAD:modernize-1.3.0
