name: Temporary runtime loader patch

on:
  push:
    branches: [modernize-1.3.0]
    paths:
      - .github/workflows/temp-runtime-loader.yml
      - tools/temp_runtime_loader_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - run: python3 tools/temp_runtime_loader_patch.py
      - run: php -l functions.inc
      - run: php tests/runtime_loader.php
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions.inc
          git commit -m "Batch Menu runtime database loading" || exit 0
          git push origin HEAD:modernize-1.3.0
