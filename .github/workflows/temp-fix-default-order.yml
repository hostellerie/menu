name: Temporary default order fix

on:
  push:
    branches:
      - modernize-1.3.0
    paths:
      - .github/workflows/temp-fix-default-order.yml
      - tools/temp_fix_default_order.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - run: python3 tools/temp_fix_default_order.py
      - run: php -l admin/index.php
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.php
          git commit -m "Select last element by default in Display After" || exit 0
          git push origin HEAD:modernize-1.3.0
