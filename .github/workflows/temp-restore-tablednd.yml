name: Temporary TableDnD restore

on:
  push:
    branches: [modernize-1.3.0]
    paths:
      - .github/workflows/temp-restore-tablednd.yml
      - tools/temp_restore_tablednd.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
          fetch-depth: 0
      - run: python3 tools/temp_restore_tablednd.py
      - run: php -l classes/classMenuElement.php
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/js/tablednd_0_6.js classes/classMenuElement.php
          git commit -m "Restore working menu drag and anchored tooltip" || exit 0
          git push origin HEAD:modernize-1.3.0
