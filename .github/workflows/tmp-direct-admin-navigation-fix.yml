name: Temporary direct Menu admin navigation fix

on:
  push:
    branches:
      - modernize-1.3.0

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0

      - name: Replace Admin Home entries directly
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('admin/index.php')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r"array\('url'\s*=>\s*\$_CONF\['site_admin_url'\],\s*\n\s*'text'\s*=>\s*\$LANG_ADMIN\['admin_home'\]\),"
          )
          replacement = (
              "array('url'  => $_CONF['site_admin_url'] . '/plugins/menu/configuration.php',\n"
              "                  'text' => $LANG_MENU01['configuration']),"
          )

          updated, count = pattern.subn(replacement, text)
          if count == 0:
              raise SystemExit('No Admin Home navigation entries found')

          path.write_text(updated, encoding='utf-8')
          print('Replaced %d Admin Home navigation entries' % count)

      - name: Commit direct source change
        run: |
          if git diff --quiet -- admin/index.php; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.php
          git commit -m "Link Menu admin navigation directly to configuration"
          git push origin HEAD:modernize-1.3.0
