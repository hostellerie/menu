name: Temporary cache filesystem patch

on:
  push:
    branches: [modernize-1.3.0]
    paths:
      - .github/workflows/temp-cache-fs.yml
      - tools/temp_cache_fs_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - run: python3 tools/temp_cache_fs_patch.py
      - run: php -l functions.inc
      - run: php tests/cache_filesystem.php
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions.inc
          git commit -m "Prevent Menu cache cleanup traversal" || exit 0
          git push origin HEAD:modernize-1.3.0
