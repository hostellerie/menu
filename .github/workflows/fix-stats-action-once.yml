name: Fix Stats action compatibility once

on:
  push:
    branches:
      - modernize-1.4.0
    paths:
      - '.github/workflows/fix-stats-action-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernize-1.4.0
          fetch-depth: 0

      - name: Align Stats menu visibility with Geeklog core
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('classes/classMenuElement.php')
          text = path.read_text()
          old = """                    case 5: // stats
                        $this->url = $_CONF['site_url'] . '/stats.php';
                        if ( !SEC_hasRights('stats.view') ) {
                            $allowed = false;
                        }

                        break;
"""
          new = """                    case 5: // stats
                        $this->url = $_CONF['site_url'] . '/stats.php';
                        // Match Geeklog core stats.php access rules. Public site
                        // statistics do not require a stats.view permission.
                        if (COM_isAnonUser()
                            && ((!empty($_CONF['loginrequired']))
                                || (!empty($_CONF['statsloginrequired'])))) {
                            $allowed = false;
                        }

                        break;
"""
          if old not in text:
              raise SystemExit('Expected Stats action block was not found')
          path.write_text(text.replace(old, new, 1))

          Path('tests/stats_action_contract.php').write_text("""<?php

// Stats action visibility contract. Compatible with PHP 5.6+.

$source = file_get_contents(dirname(__DIR__) . '/classes/classMenuElement.php');
if ($source === false) {
    fwrite(STDERR, "FAIL: unable to read classMenuElement.php\\n");
    exit(1);
}

if (strpos($source, "SEC_hasRights('stats.view')") !== false) {
    fwrite(STDERR, "FAIL: Stats action must not require stats.view\\n");
    exit(1);
}

if (strpos($source, 'statsloginrequired') === false) {
    fwrite(STDERR, "FAIL: Stats action must honor statsloginrequired\\n");
    exit(1);
}

if (strpos($source, 'COM_isAnonUser()') === false) {
    fwrite(STDERR, "FAIL: Stats action must apply login restrictions to anonymous users\\n");
    exit(1);
}

echo "Stats action visibility contract passed\\n";
""")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classes/classMenuElement.php tests/stats_action_contract.php
          git commit -m "Fix public Stats action visibility"
          git push origin HEAD:modernize-1.4.0
