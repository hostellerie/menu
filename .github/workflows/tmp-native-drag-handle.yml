name: Temporary native Menu drag handle

on:
  push:
    branches:
      - modernize-1.3.0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0

      - name: Apply native drag handle
        shell: python
        run: |
          from pathlib import Path

          p = Path('classes/classMenuElement2.php')
          s = p.read_text()
          old = '''            $moveup = '<form method="post" action="' . $actionUrl . '" style="display:inline">' . $tokenInput . '<input type="hidden" name="mode" value="move"' . XHTML . '><input type="hidden" name="where" value="up"' . XHTML . '><input type="hidden" name="mid" value="' . (int) $this->id . '"' . XHTML . '><input type="hidden" name="menu" value="' . (int) $this->menu_id . '"' . XHTML . '><button type="submit" style="border:0;background:none;padding:0;cursor:pointer">';
            $movedown = '<form method="post" action="' . $actionUrl . '" style="display:inline">' . $tokenInput . '<input type="hidden" name="mode" value="move"' . XHTML . '><input type="hidden" name="where" value="down"' . XHTML . '><input type="hidden" name="mid" value="' . (int) $this->id . '"' . XHTML . '><input type="hidden" name="menu" value="' . (int) $this->menu_id . '"' . XHTML . '><button type="submit" style="border:0;background:none;padding:0;cursor:pointer">';
'''
          if old not in s:
              raise SystemExit('move form definitions not found')
          s = s.replace(old, '', 1)

          old = '''            $retval .= '<td class="aligncenter">' . $moveup . '<img src="' . $_CONF['site_admin_url'] . '/plugins/menu/images/up.png" alt="' . $LANG_MENU01['move_up'] . '"' . XHTML . '></button></form></td><td class="aligncenter">' . $movedown . '<img src="' . $_CONF['site_admin_url'] . '/plugins/menu/images/down.png" alt="' . $LANG_MENU01['move_down'] . '"' . XHTML . '></button></form></td>';
'''
          new = '''            $moveLabel = isset($LANG_MENU01['order']) ? $LANG_MENU01['order'] : 'Move';
            $retval .= '<td class="aligncenter menu-drag-handle" tabindex="0" role="button"'
                . ' aria-label="' . htmlspecialchars($moveLabel, ENT_QUOTES, 'UTF-8') . '"'
                . ' title="' . htmlspecialchars($moveLabel, ENT_QUOTES, 'UTF-8') . '"'
                . ' data-mid="' . (int) $this->id . '"'
                . ' style="cursor:grab;touch-action:none;font-size:18px;line-height:1;user-select:none;white-space:nowrap;">'
                . '<span aria-hidden="true">&#8942;&#8942;</span></td>';
'''
          if old not in s:
              raise SystemExit('move output cells not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('admin/index.php')
          s = p.read_text()
          old = '''    jQuery(".tbl_repeat tbody").tableDnD({
        onDrop: function(table, row) {'''
          new = '''    jQuery(".tbl_repeat tbody").tableDnD({
        dragHandle: "menu-drag-handle",
        onDrop: function(table, row) {'''
          if old not in s:
              raise SystemExit('TableDnD initialization not found')
          s = s.replace(old, new, 1)

          old = '''    });

});';'''
          new = '''    });

    jQuery("td.menu-drag-handle").on("keydown", function(event) {
        var direction = null;
        var key = event.key || "";
        var keyCode = event.which || event.keyCode;
        if (key === "ArrowUp" || keyCode === 38) {
            direction = "up";
        } else if (key === "ArrowDown" || keyCode === 40) {
            direction = "down";
        }
        if (direction !== null) {
            event.preventDefault();
            var data = {
                mode: "move",
                where: direction,
                mid: parseInt(jQuery(this).attr("data-mid"), 10) || 0,
                menu: ' . (int) $menu_id . '
            };
            data[' . json_encode($dragTokenName) . '] = ' . json_encode($dragToken) . ';
            jQuery.ajax({
                type: "POST",
                url: ' . json_encode($dragPostUrl) . ',
                data: data
            }).always(function() {
                window.location.reload();
            });
        }
    });

});';'''
          if old not in s:
              raise SystemExit('TableDnD JS closing block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('templates/default/menutree.thtml')
          s = p.read_text()
          s = s.replace('<th colspan="2" style="text-align:center;">{LANG_MENU01[order]}</th>', '<th class="aligncenter" style="text-align:center;">{LANG_MENU01[order]}</th>')
          s = s.replace('<script type="text/javascript" src="{site_admin_url}/plugins/menu/js/menu-order-handle.js"></script>\n\n', '')
          p.write_text(s)

      - name: Validate
        run: |
          php -l classes/classMenuElement2.php
          php -l admin/index.php
          php tests/resolved_tree.php
          grep -q 'dragHandle: "menu-drag-handle"' admin/index.php
          grep -q 'class="aligncenter menu-drag-handle"' classes/classMenuElement2.php
          ! grep -q 'images/up.png' classes/classMenuElement2.php
          ! grep -q 'images/down.png' classes/classMenuElement2.php
          ! grep -q 'menu-order-handle.js' templates/default/menutree.thtml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classes/classMenuElement2.php admin/index.php templates/default/menutree.thtml
          git commit -m "Use native drag handle for Menu ordering"
          git push origin HEAD:modernize-1.3.0
