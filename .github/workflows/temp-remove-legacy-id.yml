name: Temporary legacy ID cleanup

on:
  push:
    branches: [modernize-1.3.0]
    paths:
      - .github/workflows/temp-remove-legacy-id.yml
      - tools/temp_remove_legacy_id_generator.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.3.0
      - run: python3 tools/temp_remove_legacy_id_generator.py
      - run: php -l classes/classMenuElement.php && php -l tests/legacy_id_generation_contract.php
      - run: php tests/legacy_id_generation_contract.php
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classes/classMenuElement.php tests/legacy_id_generation_contract.php
          git commit -m "Remove legacy manual element ID generation" || exit 0
          git push origin HEAD:modernize-1.3.0
