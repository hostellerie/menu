<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Menu Plugin now available for Geeklog CMS</title>
  <desc id="desc">Blue promotional artwork for the Geeklog Menu plugin.</desc>
